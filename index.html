<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天规 · 报丧村</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="index.html">天<span>规</span><small>TIANGUI / ART EDITION 0.2</small></a><div class="chapter">卷一 <i></i> 报丧村 <span>天道已死，戒律犹存。</span></div><nav><a href="plan.html" target="_blank">设计计划 ↗</a><button id="helpBtn">操作 / 规则</button><button id="pauseBtn">暂停 <kbd>P</kbd></button></nav></header>
<main><section class="game-column"><div class="hud"><div class="life"><span>命火 <b id="hpText">100 / 100</b></span><div class="bar"><div id="hpBar"></div></div></div><div class="hud-item">香火 <b id="coinText">0</b></div><div class="hud-item">行程 <b id="depthText">未入山</b></div><div class="hud-item seed">命签 <b id="seedText">—</b></div></div>
<div class="stage"><canvas id="game" width="1120" height="680" aria-label="天规游戏画面，WASD移动，J攻击，空格闪避，Q震步，E纸人"></canvas><div class="stage-caption"><span id="roomLabel">无名观 · 山门</span><span id="enemyLabel">以身入局 · 以律破局</span></div><div id="toast" role="status"></div><div id="overlay" class="overlay"></div></div>
<div class="skillbar"><div><kbd>W A S D</kbd><span>移动</span></div><div><kbd>J / 鼠标</kbd><span>持按 · 飞剑</span></div><button id="dashBtn"><kbd>SPACE</kbd><span id="dashLabel">闪避</span></button><button id="pushBtn"><kbd>Q</kbd><span id="pushLabel">震步 · 推敌</span></button><button id="paperBtn"><kbd>E</kbd><span id="paperLabel">纸人 · 代罚</span></button></div><p class="bottomnote">支持键盘 / 鼠标 · 切出窗口自动暂停 · 本机保存解锁 · 随机路线与功法</p></section>
<aside><div class="side-top"><span class="eyebrow">HEAVENLY EDICT</span><h2>此地天规</h2><span class="seal">敕</span></div><div id="rules"></div><div id="bellPanel" class="bell-panel"><span id="bellTitle">下次钟响</span><strong id="bellTime">—</strong><div class="bar"><div id="bellBar"></div></div><small>停步免罚 · 强制位移同样受罚</small></div><div class="build-heading"><h3>本局功法</h3><span id="buildCount">0</span></div><div id="buildList" class="build-list"><p class="muted">入山后，机缘自现。</p></div><div class="side-footer"><span>核心诀窍</span><p>钟响前，妖物也会停步。<br>靠近后用 <b>Q 震步</b>，逼它触犯天规。</p></div></aside></main>
<script src="art.js"></script><script src="game.js"></script></body></html>
